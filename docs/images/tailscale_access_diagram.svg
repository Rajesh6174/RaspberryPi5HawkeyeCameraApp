<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Verdana, Geneva, sans-serif">
  <defs>
    <marker id="ts-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="ts-arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b3fae"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <line x1="600" y1="30" x2="600" y2="560" stroke="#dbe1ec" stroke-width="2"/>

  <!-- ============ PANEL 1: On your LAN ============ -->
  <g transform="translate(0,0)">
    <text x="300" y="42" font-size="22" font-weight="bold" fill="#131b2c" text-anchor="middle">On Your LAN</text>
    <text x="300" y="65" font-size="14" fill="#5b6b84" text-anchor="middle">Same Wi-Fi / Ethernet network as the Pi</text>

    <!-- Phone/browser device -->
    <g transform="translate(220,110)">
      <rect x="0" y="0" width="160" height="70" rx="10" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <rect x="14" y="14" width="24" height="42" rx="3" fill="#131b2c"/>
      <circle cx="26" cy="49" r="2.4" fill="#eef1f7"/>
      <text x="105" y="32" font-size="13" fill="#131b2c" text-anchor="middle" font-weight="bold">Your browser</text>
      <text x="105" y="48" font-size="11.5" fill="#5b6b84" text-anchor="middle">on the same network</text>
    </g>

    <path d="M300,180 L300,225" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#ts-arrow)"/>
    <text x="316" y="205" font-size="11.5" fill="#0f766e">http://&lt;pi-ip&gt;:8000</text>

    <!-- Router -->
    <g transform="translate(230,235)">
      <rect x="0" y="0" width="140" height="54" rx="8" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <circle cx="20" cy="27" r="5" fill="#0d9488"/>
      <text x="80" y="24" font-size="12.5" fill="#131b2c" text-anchor="middle" font-weight="bold">Home router</text>
      <text x="80" y="40" font-size="10.5" fill="#5b6b84" text-anchor="middle">no port-forward needed</text>
    </g>

    <path d="M300,289 L300,334" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#ts-arrow)"/>

    <!-- Pi -->
    <g transform="translate(190,344)">
      <rect x="0" y="0" width="220" height="90" rx="10" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <rect x="18" y="18" width="34" height="34" rx="6" fill="#0d9488"/>
      <text x="130" y="34" font-size="13.5" fill="#131b2c" text-anchor="middle" font-weight="bold">Raspberry Pi</text>
      <text x="130" y="52" font-size="11" fill="#5b6b84" text-anchor="middle">camera-stream.service</text>
      <text x="130" y="68" font-size="11" fill="#5b6b84" text-anchor="middle">listening on :8000</text>
    </g>

    <g transform="translate(150,460)">
      <rect x="0" y="0" width="300" height="60" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
      <text x="150" y="26" font-size="12" fill="#131b2c" text-anchor="middle" font-weight="bold">Works out of the box</text>
      <text x="150" y="44" font-size="11" fill="#5b6b84" text-anchor="middle">Only reachable from devices on this LAN</text>
    </g>
  </g>

  <!-- ============ PANEL 2: Away from home, via Tailscale ============ -->
  <g transform="translate(600,0)">
    <text x="300" y="42" font-size="22" font-weight="bold" fill="#131b2c" text-anchor="middle">Away From Home — Tailscale</text>
    <text x="300" y="65" font-size="14" fill="#5b6b84" text-anchor="middle">Private WireGuard mesh, no port-forwarding</text>

    <!-- Phone off-LAN -->
    <g transform="translate(220,110)">
      <rect x="0" y="0" width="160" height="70" rx="10" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <rect x="14" y="14" width="24" height="42" rx="3" fill="#131b2c"/>
      <circle cx="26" cy="49" r="2.4" fill="#eef1f7"/>
      <text x="105" y="26" font-size="13" fill="#131b2c" text-anchor="middle" font-weight="bold">Your browser</text>
      <text x="105" y="42" font-size="11.5" fill="#5b6b84" text-anchor="middle">elsewhere - cellular</text>
      <text x="105" y="56" font-size="11.5" fill="#5b6b84" text-anchor="middle">or another Wi-Fi</text>
    </g>

    <path d="M300,180 L300,212" fill="none" stroke="#6d51c9" stroke-width="3" marker-end="url(#ts-arrow2)"/>
    <text x="316" y="200" font-size="11.5" fill="#5b3fae">https://device.tailnet.ts.net</text>

    <!-- Public internet cloud -->
    <g transform="translate(200,214)">
      <ellipse cx="100" cy="30" rx="100" ry="26" fill="#f5f2fd" stroke="#6d51c9" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="100" y="26" font-size="11.5" fill="#5b3fae" text-anchor="middle" font-weight="bold">Public internet</text>
      <text x="100" y="40" font-size="10" fill="#8a7ab8" text-anchor="middle">encrypted WireGuard tunnel only</text>
    </g>

    <path d="M300,268 L300,300" fill="none" stroke="#6d51c9" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#ts-arrow2)"/>

    <!-- Tailscale mesh badge -->
    <g transform="translate(190,300)">
      <rect x="0" y="0" width="220" height="46" rx="8" fill="#f5f2fd" stroke="#6d51c9" stroke-width="2"/>
      <text x="110" y="20" font-size="12.5" fill="#5b3fae" text-anchor="middle" font-weight="bold">Your tailnet</text>
      <text x="110" y="36" font-size="10.5" fill="#8a7ab8" text-anchor="middle">only devices you've signed in</text>
    </g>

    <path d="M300,346 L300,386" fill="none" stroke="#6d51c9" stroke-width="3" marker-end="url(#ts-arrow2)"/>

    <!-- Pi with tailscaled -->
    <g transform="translate(190,388)">
      <rect x="0" y="0" width="220" height="90" rx="10" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <rect x="18" y="18" width="34" height="34" rx="6" fill="#6d51c9"/>
      <text x="130" y="34" font-size="13.5" fill="#131b2c" text-anchor="middle" font-weight="bold">Raspberry Pi</text>
      <text x="130" y="52" font-size="11" fill="#5b6b84" text-anchor="middle">tailscaled + tailscale serve</text>
      <text x="130" y="68" font-size="11" fill="#5b6b84" text-anchor="middle">reverse-proxies to :8000</text>
    </g>

    <g transform="translate(150,489)">
      <rect x="0" y="0" width="300" height="60" rx="8" fill="#f5f2fd" stroke="#6d51c9" stroke-width="2"/>
      <text x="150" y="26" font-size="12" fill="#131b2c" text-anchor="middle" font-weight="bold">Real TLS, no VPN toggling</text>
      <text x="150" y="44" font-size="11" fill="#5b6b84" text-anchor="middle">Never exposed to the public internet</text>
    </g>
  </g>

  <text x="600" y="595" font-size="12" fill="#8493ab" text-anchor="middle">Tailscale replaces port-forwarding with a private mesh network between only your own devices.</text>
  <text x="600" y="612" font-size="12" fill="#8493ab" text-anchor="middle">Basic Auth (if enabled) still applies on both paths - Tailscale changes reachability, not the login.</text>
</svg>
