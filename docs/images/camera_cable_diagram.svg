<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="Verdana, Geneva, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b3fae"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#ffffff"/>
  <line x1="600" y1="30" x2="600" y2="590" stroke="#dbe1ec" stroke-width="2"/>

  <!-- ============ PANEL 1: Raspberry Pi 4 ============ -->
  <g transform="translate(0,0)">
    <text x="300" y="42" font-size="22" font-weight="bold" fill="#131b2c" text-anchor="middle">Raspberry Pi 4</text>
    <text x="300" y="65" font-size="14" fill="#5b6b84" text-anchor="middle">15-pin &#8594; 15-pin ribbon cable</text>

    <!-- Camera board -->
    <g transform="translate(60,110)">
      <rect x="0" y="0" width="110" height="80" rx="8" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <circle cx="55" cy="38" r="24" fill="#131b2c"/>
      <circle cx="55" cy="38" r="14" fill="#0d9488"/>
      <circle cx="14" cy="12" r="3" fill="#9aa7bd"/>
      <circle cx="96" cy="12" r="3" fill="#9aa7bd"/>
      <!-- connector tab, right edge -->
      <rect x="106" y="30" width="10" height="16" fill="#0d9488"/>
      <text x="55" y="100" font-size="13" fill="#131b2c" text-anchor="middle" font-weight="bold">Camera board</text>
      <text x="55" y="117" font-size="11.5" fill="#5b6b84" text-anchor="middle">Arducam 64MP or Cam Module 3</text>
      <text x="55" y="132" font-size="11.5" fill="#5b6b84" text-anchor="middle">15-pin FPC connector</text>
    </g>

    <!-- Ribbon cable -->
    <path d="M172,146 C 260,146 260,146 260,190 L 260,240" fill="none" stroke="#c7902e" stroke-width="14" stroke-linecap="round"/>
    <path d="M172,146 C 260,146 260,146 260,190 L 260,240" fill="none" stroke="#e8b968" stroke-width="10" stroke-linecap="round"/>
    <!-- rungs suggesting FPC ribbon -->
    <g stroke="#a97418" stroke-width="1.4">
      <line x1="185" y1="140" x2="185" y2="152"/>
      <line x1="200" y1="139" x2="200" y2="153"/>
      <line x1="215" y1="139" x2="215" y2="153"/>
      <line x1="230" y1="139" x2="230" y2="153"/>
      <line x1="245" y1="141" x2="245" y2="153"/>
    </g>

    <!-- Pi board -->
    <g transform="translate(160,240)">
      <rect x="0" y="0" width="320" height="170" rx="10" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <!-- CSI connector slot, top edge -->
      <rect x="84" y="-6" width="32" height="12" rx="2" fill="#0d9488"/>
      <text x="100" y="26" font-size="12" fill="#131b2c" text-anchor="middle" font-weight="bold">CSI camera port</text>
      <text x="100" y="41" font-size="10.5" fill="#5b6b84" text-anchor="middle">15-pin, 1mm pitch</text>
      <!-- HDMI ports, bottom-left -->
      <rect x="16" y="140" width="34" height="18" rx="2" fill="#131b2c"/>
      <rect x="56" y="140" width="34" height="18" rx="2" fill="#131b2c"/>
      <text x="53" y="132" font-size="12" fill="#131b2c" text-anchor="middle" font-weight="bold">HDMI</text>
      <!-- USB/ETH, bottom-right -->
      <rect x="220" y="138" width="46" height="22" rx="2" fill="#131b2c"/>
      <rect x="270" y="138" width="34" height="22" rx="2" fill="#131b2c"/>
      <text x="262" y="130" font-size="11" fill="#131b2c" text-anchor="middle" font-weight="bold">USB / ETH</text>
      <text x="160" y="95" font-size="15" fill="#131b2c" text-anchor="middle" font-weight="bold">Raspberry Pi 4</text>
    </g>

    <!-- orientation arrow: points from the CSI slot toward HDMI, see callouts below -->
    <path d="M330,246 L330,275" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="330" y="292" font-size="10.5" fill="#0f766e" text-anchor="middle">toward HDMI</text>

    <!-- correct/incorrect callout -->
    <g transform="translate(80,450)">
      <circle cx="30" cy="30" r="30" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
      <path d="M8,32 h44" stroke="#0d9488" stroke-width="7" stroke-linecap="round"/>
      <path d="M18,26 v12 M28,24 v16 M38,26 v12" stroke="#0f766e" stroke-width="2"/>
      <circle cx="66" cy="8" r="13" fill="#0d9488"/>
      <path d="M60,8 l4,5 8,-9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="80" font-size="11.5" fill="#131b2c" text-anchor="middle">Correct: contacts toward HDMI</text>
    </g>
    <g transform="translate(300,450)">
      <circle cx="30" cy="30" r="30" fill="#fef2f2" stroke="#c23b3b" stroke-width="2.5"/>
      <path d="M8,32 h44" stroke="#c9a06a" stroke-width="7" stroke-linecap="round"/>
      <path d="M18,26 v12 M28,24 v16 M38,26 v12" stroke="#8a6a3a" stroke-width="2"/>
      <circle cx="66" cy="8" r="13" fill="#c23b3b"/>
      <path d="M60,2 l12,12 M72,2 l-12,12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="30" y="80" font-size="11.5" fill="#131b2c" text-anchor="middle">Wrong: reversed - won't be seen</text>
    </g>
  </g>

  <!-- ============ PANEL 2: Raspberry Pi 5 ============ -->
  <g transform="translate(600,0)">
    <text x="300" y="42" font-size="22" font-weight="bold" fill="#131b2c" text-anchor="middle">Raspberry Pi 5</text>
    <text x="300" y="65" font-size="14" fill="#5b6b84" text-anchor="middle">15-pin &#8594; 22-pin adapter cable</text>

    <!-- Camera board -->
    <g transform="translate(60,110)">
      <rect x="0" y="0" width="110" height="80" rx="8" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <circle cx="55" cy="38" r="24" fill="#131b2c"/>
      <circle cx="55" cy="38" r="14" fill="#0d9488"/>
      <circle cx="14" cy="12" r="3" fill="#9aa7bd"/>
      <circle cx="96" cy="12" r="3" fill="#9aa7bd"/>
      <rect x="106" y="30" width="10" height="16" fill="#0d9488"/>
      <text x="55" y="100" font-size="13" fill="#131b2c" text-anchor="middle" font-weight="bold">Camera board</text>
      <text x="55" y="117" font-size="11.5" fill="#5b6b84" text-anchor="middle">Arducam 64MP or Cam Module 3</text>
      <text x="55" y="132" font-size="11.5" fill="#5b6b84" text-anchor="middle">15-pin FPC connector</text>
    </g>

    <!-- Ribbon cable, tapered wider->narrower to hint 15->22 adapter -->
    <path d="M172,146 C 260,146 260,146 260,190 L 260,240" fill="none" stroke="#6d51c9" stroke-width="14" stroke-linecap="round"/>
    <path d="M172,146 C 260,146 260,146 260,190 L 260,240" fill="none" stroke="#b79cf0" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#5b3fae" stroke-width="1.4">
      <line x1="185" y1="140" x2="185" y2="152"/>
      <line x1="200" y1="139" x2="200" y2="153"/>
      <line x1="215" y1="139" x2="215" y2="153"/>
      <line x1="230" y1="139" x2="230" y2="153"/>
      <line x1="245" y1="141" x2="245" y2="153"/>
    </g>
    <text x="222" y="175" font-size="10" fill="#5b3fae" font-weight="bold">adapter</text>

    <!-- Pi board -->
    <g transform="translate(160,240)">
      <rect x="0" y="0" width="320" height="170" rx="10" fill="#eef1f7" stroke="#4a5b7a" stroke-width="2.5"/>
      <rect x="84" y="-6" width="36" height="12" rx="2" fill="#6d51c9"/>
      <text x="102" y="26" font-size="12" fill="#131b2c" text-anchor="middle" font-weight="bold">CAM/DISP0 or 1</text>
      <text x="102" y="41" font-size="10.5" fill="#5b6b84" text-anchor="middle">22-pin, 0.5mm pitch</text>
      <rect x="16" y="140" width="34" height="18" rx="2" fill="#131b2c"/>
      <rect x="56" y="140" width="34" height="18" rx="2" fill="#131b2c"/>
      <text x="53" y="132" font-size="12" fill="#131b2c" text-anchor="middle" font-weight="bold">HDMI</text>
      <rect x="220" y="138" width="46" height="22" rx="2" fill="#131b2c"/>
      <rect x="270" y="138" width="34" height="22" rx="2" fill="#131b2c"/>
      <text x="262" y="130" font-size="11" fill="#131b2c" text-anchor="middle" font-weight="bold">USB / ETH</text>
      <text x="160" y="95" font-size="15" fill="#131b2c" text-anchor="middle" font-weight="bold">Raspberry Pi 5</text>
    </g>

    <path d="M400,246 L400,275" fill="none" stroke="#6d51c9" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="400" y="292" font-size="10.5" fill="#5b3fae" text-anchor="middle">toward USB/ETH</text>
    <text x="400" y="306" font-size="9.5" fill="#8493ab" text-anchor="middle">(opposite of Pi 4)</text>

    <g transform="translate(80,450)">
      <circle cx="30" cy="30" r="30" fill="#f5f2fd" stroke="#6d51c9" stroke-width="2.5"/>
      <path d="M8,32 h44" stroke="#6d51c9" stroke-width="7" stroke-linecap="round"/>
      <path d="M18,26 v12 M28,24 v16 M38,26 v12" stroke="#5b3fae" stroke-width="2"/>
      <circle cx="66" cy="8" r="13" fill="#0d9488"/>
      <path d="M60,8 l4,5 8,-9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="80" font-size="11.5" fill="#131b2c" text-anchor="middle">Correct: contacts toward USB/ETH</text>
    </g>
    <g transform="translate(300,450)">
      <circle cx="30" cy="30" r="30" fill="#fef2f2" stroke="#c23b3b" stroke-width="2.5"/>
      <path d="M8,32 h44" stroke="#c9a3d6" stroke-width="7" stroke-linecap="round"/>
      <path d="M18,26 v12 M28,24 v16 M38,26 v12" stroke="#8a5a9a" stroke-width="2"/>
      <circle cx="66" cy="8" r="13" fill="#c23b3b"/>
      <path d="M60,2 l12,12 M72,2 l-12,12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="30" y="80" font-size="11.5" fill="#131b2c" text-anchor="middle">Wrong: reversed - won't be seen</text>
    </g>
  </g>

  <text x="600" y="608" font-size="12" fill="#8493ab" text-anchor="middle">Both cameras share the same 15-pin camera-side connector - only the Pi-side connector and cable differ.</text>
  <text x="600" y="628" font-size="12" fill="#8493ab" text-anchor="middle">Contact orientation is mirrored between the two boards - double-check which one you're building before inserting.</text>
</svg>
