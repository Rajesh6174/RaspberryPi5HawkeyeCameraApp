<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- camera glyph -->
  <g transform="translate(110,90)" fill="none" stroke="#5eead4" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="30" width="150" height="100" rx="14"/>
    <rect x="40" y="6" width="70" height="30" rx="8"/>
    <circle cx="75" cy="82" r="34" fill="#0f172a"/>
    <circle cx="75" cy="82" r="34"/>
    <circle cx="75" cy="82" r="16" fill="#5eead4"/>
    <circle cx="128" cy="52" r="5" fill="#5eead4" stroke="none"/>
  </g>

  <!-- title -->
  <g font-family="Verdana, Geneva, sans-serif">
    <text x="330" y="140" font-size="56" font-weight="bold" fill="#f8fafc">Hawkeye Camera</text>
    <text x="330" y="178" font-size="22" fill="#94a3b8">Raspberry Pi 5 / 4 &#8226; Live Stream &#8226; Garage Watcher &#8226; Cloud Backup</text>
  </g>

  <!-- feature row -->
  <g font-family="Verdana, Geneva, sans-serif" font-size="17" fill="#cbd5e1">
    <!-- stream -->
    <g transform="translate(330,225)">
      <path d="M0,20 a20,20 0 0,1 0,-20 M-10,25 a32,32 0 0,1 0,-30" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
      <circle cx="4" cy="10" r="5" fill="#5eead4"/>
      <text x="30" y="16">Live 4K stream</text>
    </g>
    <!-- snapshot -->
    <g transform="translate(560,225)">
      <rect x="-4" y="-2" width="30" height="22" rx="4" fill="none" stroke="#5eead4" stroke-width="4"/>
      <circle cx="11" cy="9" r="6" fill="none" stroke="#5eead4" stroke-width="4"/>
      <text x="40" y="16">Snapshots &amp; recordings</text>
    </g>
    <!-- cloud -->
    <g transform="translate(830,225)">
      <path d="M-6,14 a10,10 0 0,1 2,-19 a14,14 0 0,1 26,4 a9,9 0 0,1 -2,17 z" fill="none" stroke="#5eead4" stroke-width="4" stroke-linejoin="round"/>
      <text x="40" y="16">Google Drive backup</text>
    </g>
    <!-- bell -->
    <g transform="translate(1040,225)">
      <path d="M4,0 a12,12 0 0,1 12,12 v8 l4,6 h-32 l4,-6 v-8 a12,12 0 0,1 12,-12 z" fill="none" stroke="#5eead4" stroke-width="4" stroke-linejoin="round"/>
      <text x="40" y="16">Telegram alerts</text>
    </g>
  </g>
</svg>
